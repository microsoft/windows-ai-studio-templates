# Parameters from llmfinetune 2.7.0 (transformers 5.9.0).
# Training batch size and sequence length follow the Phi Silica A100 defaults.
# Aion-1.1 loads its bundled architecture and weights from /model.
adam_beta1: 0.9
adam_beta2: 0.95
adam_epsilon: 1.0e-08
early_stopping_patience: 5
epochs: 1
eval_accumulation_steps: null
eval_delay: 0
eval_steps: 64
evaluation_strategy: steps
save_dir: mount/<run_id>/save_dir
finetune_dataset: mount/<run_id>/dataset
finetune_test_batch_size: 8
finetune_test_nsamples: 128
finetune_test_seqlen: 2048
finetune_train_batch_size: 2
finetune_train_nsamples: 4096
finetune_train_seqlen: 1024
gradient_accumulation_steps: 1
gradient_checkpointing: false
learning_rate: 0.0002
lr_scheduler_type: linear
max_grad_norm: 1.0
model: Aion-1.1
model_path: /model
num_warmup_steps: 400
save_steps: 64
seed: 42
weight_decay: 0.0
compare_enabled: false
compare_file: mount/<run_id>/<compare_file>
compare_temperature: 0.9
skip_finetune: false
adapter_path: ''
system_prompt: null
varied_seqlen: false
trust_remote_code: true
